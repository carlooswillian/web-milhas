<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar de Milhas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons para ícones modernos -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Fonte Inter (Padrão de apps modernos) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Oculta scrollbar horizontal mantendo o scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Previne o bounce effect no iOS */
        body { overscroll-behavior-y: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header / App Bar (Sticky + Blur) -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b border-gray-200">
        <div class="max-w-md mx-auto px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-airplane-tilt text-brand-600 text-2xl"></i>
                <h1 class="text-lg font-bold tracking-tight text-gray-900">Radar de Milhas</h1>
            </div>
            <button onclick="carregarDados()" id="btn-atualizar" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition active:scale-95">
                <i class="ph ph-arrows-clockwise text-lg" id="icone-atualizar"></i>
            </button>
        </div>
    </header>

    <!-- App Navigation (Segmented Control estilo iOS) -->
    <div class="sticky top-[68px] z-40 bg-gray-50 pt-4 pb-2 px-5">
        <div class="max-w-md mx-auto bg-gray-200/80 p-1 rounded-xl flex gap-1 backdrop-blur-sm">
            <button onclick="mudarAba('promocoes')" id="tab-promocoes" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-gray-900 shadow-sm transition-all duration-200">
                Promoções
            </button>
            <button onclick="mudarAba('datas')" id="tab-datas" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-700 transition-all duration-200">
                Calendário
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-md mx-auto w-full px-5 pb-8 flex-grow">

        <!-- SEÇÃO 1: PROMOÇÕES -->
        <section id="secao-promocoes" class="animate-fade-in mt-2">
            <!-- Filtros Chips -->
            <div class="flex gap-2 overflow-x-auto pb-4 pt-2 no-scrollbar">
                <button onclick="filtrarPrograma('TODOS')" class="filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-gray-900 text-white whitespace-nowrap shadow-sm transition active:scale-95">Todos</button>
                <button onclick="filtrarPrograma('Iberia')" class="filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap shadow-sm transition active:scale-95">Iberia</button>
                <button onclick="filtrarPrograma('Latam')" class="filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap shadow-sm transition active:scale-95">Latam</button>
                <button onclick="filtrarPrograma('Azul')" class="filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap shadow-sm transition active:scale-95">Azul</button>
                <button onclick="filtrarPrograma('Smiles')" class="filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap shadow-sm transition active:scale-95">Smiles</button>
                <button onclick="filtrarPrograma('Esfera')" class="filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap shadow-sm transition active:scale-95">Esfera</button>
                <button onclick="filtrarPrograma('Livelo')" class="filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap shadow-sm transition active:scale-95">Livelo</button>
            </div>

            <!-- Lista de Cards -->
            <div id="lista-promocoes" class="space-y-4">
                <!-- Skeleton Loading Inicial -->
                <div class="flex justify-center items-center py-12 gap-2 text-gray-400">
                    <i class="ph ph-spinner animate-spin text-2xl"></i>
                    <span class="text-sm font-medium">Buscando oportunidades...</span>
                </div>
            </div>
        </section>

        <!-- SEÇÃO 2: DATAS IMPORTANTES (Card List) -->
        <section id="secao-datas" class="hidden mt-4">
            <div id="lista-datas" class="space-y-3">
                <!-- Preenchido via JS -->
            </div>
        </section>

    </main>

    <script>
        // ==========================================
        // CONFIGURAÇÃO: COLE SUA URL AQUI
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbzBhtgqxEqqJyOPM4IicpDtP40elxA7SFnLpqB2nsvu4rNqcKv9b0UvrVFl_HmOugnT/exec";

        let dadosGlobais = { promocoes: [], datas: [] };
        let programaAtual = "TODOS";

        async function carregarDados() {
            const icone = document.getElementById("icone-atualizar");
            const btn = document.getElementById("btn-atualizar");
            
            // Estado de loading visual no header
            icone.classList.add("animate-spin");
            btn.classList.add("bg-gray-200");

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                dadosGlobais = data;
                renderizarPromocoes();
                renderizarDatas();
            } catch (error) {
                console.error("Erro ao buscar dados:", error);
                document.getElementById("lista-promocoes").innerHTML = `
                    <div class="flex flex-col items-center justify-center p-8 text-center bg-red-50 rounded-2xl border border-red-100">
                        <i class="ph ph-warning-circle text-red-500 text-3xl mb-2"></i>
                        <p class="text-sm text-red-700 font-medium">Falha ao conectar com o servidor.</p>
                        <p class="text-xs text-red-500 mt-1">Verifique sua internet e a URL da API.</p>
                    </div>`;
            }
            
            // Remove estado de loading
            setTimeout(() => {
                icone.classList.remove("animate-spin");
                btn.classList.remove("bg-gray-200");
            }, 500);
        }

                function renderizarPromocoes() {
            const container = document.getElementById("lista-promocoes");
            let filtradas = dadosGlobais.promocoes;

            // A MUDANÇA FOI AQUI: usando .includes() em vez de ===
            if (programaAtual !== "TODOS") {
                filtradas = filtradas.filter(p => 
                    p.programa.toLowerCase().includes(programaAtual.toLowerCase())
                );
            }

            if (filtradas.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-10 text-center border-2 border-dashed border-gray-200 rounded-2xl mt-4">
                        <i class="ph ph-magnifying-glass text-gray-300 text-4xl mb-2"></i>
                        <p class="text-sm text-gray-500 font-medium">Nenhuma promoção encontrada<br>para este filtro no momento.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtradas.map(p => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 active:bg-gray-50 transition flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <span class="px-2.5 py-1 text-[11px] font-bold tracking-wide uppercase bg-brand-50 text-brand-700 rounded-lg">
                            ${p.programa}
                        </span>
                        <div class="flex items-center gap-1 text-gray-400 text-xs font-medium">
                            <i class="ph ph-clock"></i>
                            <span>${p.dataCaptura.split(' ')[0]}</span>
                        </div>
                    </div>
                    
                    <h2 class="font-bold text-gray-900 text-[15px] leading-snug">${p.titulo}</h2>
                    
                    <div class="pt-3 mt-1 border-t border-gray-50 flex justify-between items-center">
                        <div class="flex items-center gap-1.5 text-xs text-gray-500 font-medium">
                            <i class="ph ${p.categoria.toLowerCase().includes('compra') ? 'ph-shopping-cart' : 'ph-arrows-left-right'} text-gray-400 text-sm"></i>
                            <span class="truncate max-w-[150px]">${p.categoria}</span>
                        </div>
                        <a href="${p.link}" target="_blank" class="flex items-center gap-1 px-3 py-1.5 bg-gray-900 text-white text-xs font-semibold rounded-lg hover:bg-gray-800 transition active:scale-95">
                            Acessar <i class="ph-bold ph-arrow-right"></i>
                        </a>
                    </div>
                </div>
            `).join("");
        }


        function renderizarDatas() {
            const container = document.getElementById("lista-datas");
            if (!dadosGlobais.datas || dadosGlobais.datas.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-10 text-center border-2 border-dashed border-gray-200 rounded-2xl mt-4">
                        <i class="ph ph-calendar-blank text-gray-300 text-4xl mb-2"></i>
                        <p class="text-sm text-gray-500 font-medium">Nenhum evento mapeado.</p>
                    </div>`;
                return;
            }

            // Transforma a tabela em uma lista de cards verticais
            container.innerHTML = dadosGlobais.datas.map(d => {
                const isConfirmado = d.status.toLowerCase() === 'confirmado';
                const statusColorClass = isConfirmado ? 'bg-green-50 text-green-700 border-green-200' : 'bg-amber-50 text-amber-700 border-amber-200';
                const statusIcon = isConfirmado ? 'ph-check-circle' : 'ph-clock-countdown';

                return `
                <div class="flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center border border-gray-100 flex-shrink-0">
                            <i class="ph-fill ph-calendar-star text-gray-400 text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900 text-[15px] leading-tight">${d.evento}</h3>
                            <p class="text-xs text-gray-500 mt-0.5 font-medium">${d.programa} &bull; ${d.mesPrevisto}</p>
                        </div>
                    </div>
                    <div class="flex-shrink-0 ml-2">
                        <span class="flex items-center gap-1 px-2 py-1 text-[10px] font-bold uppercase tracking-wide border rounded-md ${statusColorClass}">
                            <i class="ph ${statusIcon}"></i>
                            ${d.status}
                        </span>
                    </div>
                </div>
            `}).join("");
        }

        function mudarAba(aba) {
            const secPromo = document.getElementById("secao-promocoes");
            const secDatas = document.getElementById("secao-datas");
            const btnPromo = document.getElementById("tab-promocoes");
            const btnDatas = document.getElementById("tab-datas");

            const activeClass = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-gray-900 shadow-sm transition-all duration-200";
            const inactiveClass = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-700 transition-all duration-200";

            if (aba === 'promocoes') {
                secPromo.classList.remove("hidden");
                secDatas.classList.add("hidden");
                btnPromo.className = activeClass;
                btnDatas.className = inactiveClass;
            } else {
                secPromo.classList.add("hidden");
                secDatas.classList.remove("hidden");
                btnDatas.className = activeClass;
                btnPromo.className = inactiveClass;
            }
        }

        function filtrarPrograma(prog) {
            programaAtual = prog;
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                if (btn.innerText.toLowerCase() === prog.toLowerCase() || (prog === 'TODOS' && btn.innerText === 'Todos')) {
                    btn.className = "filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-gray-900 text-white whitespace-nowrap shadow-sm transition active:scale-95";
                } else {
                    btn.className = "filtro-btn px-4 py-1.5 text-sm font-medium rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap shadow-sm transition active:scale-95";
                }
            });
            renderizarPromocoes();
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
