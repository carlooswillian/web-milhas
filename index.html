<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Milhas e Promoções</title>
    <!-- Tailwind CSS para um design limpo e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">✈️ Radar de Milhas</h1>
            <button onclick="carregarDados()" id="btn-atualizar" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition font-medium">Atualizar</button>
        </div>
    </header>

    <!-- Navegação de Abas -->
    <nav class="max-w-4xl w-full mx-auto px-4 mt-4 flex gap-2 border-b border-slate-200 pb-2">
        <button onclick="mudarAba('promocoes')" id="tab-promocoes" class="px-4 py-2 font-semibold text-sm rounded-lg bg-blue-600 text-white transition shadow-sm">Radar de Promoções</button>
        <button onclick="mudarAba('datas')" id="tab-datas" class="px-4 py-2 font-semibold text-sm rounded-lg bg-white text-slate-600 hover:bg-slate-100 transition">Datas Importantes</button>
    </nav>

    <!-- Container Principal -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow">

        <!-- SEÇÃO 1: PROMOÇÕES -->
        <section id="secao-promocoes">
            <!-- Filtros por Programa -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
                <button onclick="filtrarPrograma('TODOS')" class="filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-slate-800 text-white whitespace-nowrap">Todos</button>
                <button onclick="filtrarPrograma('Iberia')" class="filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-white border border-slate-300 text-slate-700 whitespace-nowrap hover:bg-slate-100">Iberia</button>
                <button onclick="filtrarPrograma('Latam')" class="filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-white border border-slate-300 text-slate-700 whitespace-nowrap hover:bg-slate-100">Latam</button>
                <button onclick="filtrarPrograma('Azul')" class="filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-white border border-slate-300 text-slate-700 whitespace-nowrap hover:bg-slate-100">Azul</button>
                <button onclick="filtrarPrograma('Smiles')" class="filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-white border border-slate-300 text-slate-700 whitespace-nowrap hover:bg-slate-100">Smiles</button>
                <button onclick="filtrarPrograma('Esfera')" class="filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-white border border-slate-300 text-slate-700 whitespace-nowrap hover:bg-slate-100">Esfera</button>
                <button onclick="filtrarPrograma('Livelo')" class="filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-white border border-slate-300 text-slate-700 whitespace-nowrap hover:bg-slate-100">Livelo</button>
            </div>

            <!-- Lista de Cards -->
            <div id="lista-promocoes" class="space-y-3">
                <div class="text-center py-10 text-slate-400 text-sm">Carregando promoções...</div>
            </div>
        </section>

        <!-- SEÇÃO 2: DATAS IMPORTANTES -->
        <section id="secao-datas" class="hidden">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                            <th class="p-3 font-semibold">Programa</th>
                            <th class="p-3 font-semibold">Evento Histórico</th>
                            <th class="p-3 font-semibold">Mês Previsto</th>
                            <th class="p-3 font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-datas">
                        <tr><td colspan="4" class="p-4 text-center text-slate-400">Carregando datas...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        Painel Pessoal de Milhas &bull; Sincronizado com Google Sheets
    </footer>

    <!-- Script de Integração com a API -->
    <script>
        // COLE SUA URL DO GOOGLE APPS SCRIPT ABAIXO ENTRE AS ASPAS:
        const API_URL = "https://script.google.com/macros/s/AKfycbzBhtgqxEqqJyOPM4IicpDtP40elxA7SFnLpqB2nsvu4rNqcKv9b0UvrVFl_HmOugnT/exec";

        let dadosGlobais = { promocoes: [], datas: [] };
        let programaAtual = "TODOS";

        async function carregarDados() {
            const btn = document.getElementById("btn-atualizar");
            btn.innerText = "Carregando...";
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                dadosGlobais = data;
                renderizarPromocoes();
                renderizarDatas();
            } catch (error) {
                console.error("Erro ao buscar dados:", error);
                document.getElementById("lista-promocoes").innerHTML = `<div class="text-center py-10 text-red-500 text-sm">Erro ao carregar os dados. Verifique a API.</div>`;
            }
            btn.innerText = "Atualizar";
        }

        function renderizarPromocoes() {
            const container = document.getElementById("lista-promocoes");
            let filtradas = dadosGlobais.promocoes;

            if (programaAtual !== "TODOS") {
                filtradas = filtradas.filter(p => p.programa.toLowerCase() === programaAtual.toLowerCase());
            }

            if (filtradas.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-slate-400 text-sm">Nenhuma promoção encontrada para este programa.</div>`;
                return;
            }

            container.innerHTML = filtradas.map(p => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:shadow transition flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <span class="px-2.5 py-0.5 text-xs font-semibold bg-blue-50 text-blue-700 rounded-full">${p.programa}</span>
                        <span class="text-xs text-slate-400">${p.dataCaptura}</span>
                    </div>
                    <h2 class="font-semibold text-slate-800 text-sm sm:text-base leading-snug">${p.titulo}</h2>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-xs text-slate-500 font-medium uppercase tracking-wider">${p.categoria}</span>
                        <a href="${p.link}" target="_blank" class="text-xs font-semibold text-blue-600 hover:underline flex items-center gap-1">Ver Matéria &rarr;</a>
                    </div>
                </div>
            `).join("");
        }

        function renderizarDatas() {
            const tbody = document.getElementById("tabela-datas");
            if (!dadosGlobais.datas || dadosGlobais.datas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Nenhuma data importante cadastrada na planilha.</td></tr>`;
                return;
            }

            tbody.innerHTML = dadosGlobais.datas.map(d => `
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="p-3 font-medium text-slate-700">${d.programa}</td>
                    <td class="p-3 text-slate-600">${d.evento}</td>
                    <td class="p-3 text-slate-600">${d.mesPrevisto}</td>
                    <td class="p-3"><span class="px-2 py-0.5 text-xs rounded-full font-medium ${d.status === 'Confirmado' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">${d.status}</span></td>
                </tr>
            `).join("");
        }

        function mudarAba(aba) {
            const secPromo = document.getElementById("secao-promocoes");
            const secDatas = document.getElementById("secao-datas");
            const btnPromo = document.getElementById("tab-promocoes");
            const btnDatas = document.getElementById("tab-datas");

            if (aba === 'promocoes') {
                secPromo.classList.remove("hidden");
                secDatas.classList.add("hidden");
                btnPromo.className = "px-4 py-2 font-semibold text-sm rounded-lg bg-blue-600 text-white transition shadow-sm";
                btnDatas.className = "px-4 py-2 font-semibold text-sm rounded-lg bg-white text-slate-600 hover:bg-slate-100 transition";
            } else {
                secPromo.classList.add("hidden");
                secDatas.classList.remove("hidden");
                btnDatas.className = "px-4 py-2 font-semibold text-sm rounded-lg bg-blue-600 text-white transition shadow-sm";
                btnPromo.className = "px-4 py-2 font-semibold text-sm rounded-lg bg-white text-slate-600 hover:bg-slate-100 transition";
            }
        }

        function filtrarPrograma(prog) {
            programaAtual = prog;
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                if (btn.innerText.toLowerCase() === prog.toLowerCase() || (prog === 'TODOS' && btn.innerText === 'Todos')) {
                    btn.className = "filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-slate-800 text-white whitespace-nowrap";
                } else {
                    btn.className = "filtro-btn px-3 py-1 text-xs font-medium rounded-full bg-white border border-slate-300 text-slate-700 whitespace-nowrap hover:bg-slate-100";
                }
            });
            renderizarPromocoes();
        }

        // Carrega os dados assim que a página abrir
        carregarDados();
    </script>
</body>
</html>
